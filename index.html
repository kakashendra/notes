<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Заметки</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{
  --bg:var(--tg-theme-secondary-bg-color,#efeff3);
  --row:var(--tg-theme-bg-color,#fff);
  --text:var(--tg-theme-text-color,#000);
  --hint:var(--tg-theme-hint-color,#8e8e93);
  --accent:var(--tg-theme-button-color,#3390ec);
  --accent-text:var(--tg-theme-button-text-color,#fff);
  --link:var(--tg-theme-link-color,#3390ec);
  --sep:var(--tg-theme-section-separator-color,rgba(128,128,128,.25));
  --danger:var(--tg-theme-destructive-text-color,#e53935);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);
  font:16px/1.35 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
  -webkit-font-smoothing:antialiased}
#app{min-height:100%;padding:8px 0 96px;padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
.search{margin:4px 16px 12px;display:flex;align-items:center;gap:8px;padding:0 12px;height:36px;border-radius:10px;background:rgba(128,128,128,.14);color:var(--hint)}
.search input{flex:1;border:0;background:none;outline:0;font:inherit;color:var(--text);min-width:0}
.head{display:flex;align-items:center;justify-content:space-between;padding:4px 16px 8px}
.head h1{margin:0;font-size:22px;font-weight:700}
.link{color:var(--link);font-size:16px}
.group{background:var(--row);border-radius:12px;margin:0 16px 16px;overflow:hidden}
.item{display:flex;align-items:center;gap:12px;width:100%;padding:0 14px;min-height:52px;text-align:left;position:relative}
.item:active{background:rgba(128,128,128,.14)}
.item+.item::before{content:"";position:absolute;top:0;left:58px;right:0;border-top:.5px solid var(--sep)}
.ico{flex:none;width:30px;height:30px;border-radius:8px;display:grid;place-items:center}
.ico svg{width:18px;height:18px;fill:#fff}
.item .name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .cnt{color:var(--hint)}
.chev{width:8px;height:14px;stroke:var(--hint);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;opacity:.7}
.note{display:block;padding:9px 14px 10px;min-height:0}
.note::before{left:14px!important}
.note .top{display:flex;justify-content:space-between;gap:12px}
.note .t{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.note .d{color:var(--hint);font-size:14px;flex:none}
.note .p{color:var(--hint);font-size:15px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;white-space:normal}
.note .f{color:var(--link);font-size:13px;margin-top:2px}
.empty{text-align:center;color:var(--hint);padding:56px 32px}
.empty b{display:block;color:var(--text);font-size:17px;margin-bottom:4px}
.fab{position:fixed;right:16px;bottom:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));width:56px;height:56px;border-radius:50%;background:var(--accent);display:grid;place-items:center;box-shadow:0 3px 10px rgba(0,0,0,.25)}
.fab svg{width:24px;height:24px;stroke:var(--accent-text);fill:none;stroke-width:2;stroke-linecap:round}
.fab:active{transform:scale(.94)}
.editor{padding:0 16px}
.editor .chip{display:inline-flex;align-items:center;gap:6px;color:var(--link);font-size:15px;padding:6px 0 10px}
.editor .chip svg{width:16px;height:16px;fill:currentColor}
.editor input,.editor textarea{display:block;width:100%;border:0;outline:0;background:none;color:var(--text);font:inherit;resize:none;padding:0}
.editor input{font-size:22px;font-weight:700;margin-bottom:10px}
.editor textarea{font-size:17px;line-height:1.45;min-height:50vh;overflow:hidden}
.editor ::placeholder{color:var(--hint);opacity:.8}
.count{color:var(--hint);font-size:13px;text-align:right;padding-top:6px}
.shade{position:fixed;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:flex-end;z-index:5;animation:fade .18s}
.sheet{width:100%;background:var(--row);border-radius:14px 14px 0 0;padding:8px 0;padding-bottom:calc(8px + env(safe-area-inset-bottom,0px));max-height:75vh;overflow:auto;animation:up .22s ease-out}
.sheet h3{margin:0;padding:10px 16px 6px;font-size:15px;font-weight:600;color:var(--hint);text-align:center}
.sheet .item{min-height:50px}
.sheet .item::before{left:16px}
.sheet .danger{color:var(--danger)}
.sheet .field{margin:8px 16px 12px;padding:0 12px;height:44px;border-radius:10px;background:rgba(128,128,128,.14);display:block;width:calc(100% - 32px);border:0;outline:0;color:var(--text);font:inherit}
.colors{display:flex;gap:10px;justify-content:center;padding:0 16px 12px}
.colors button{width:30px;height:30px;border-radius:50%;border:3px solid transparent;background-clip:padding-box}
.colors button.on{border-color:var(--accent)}
.btn{display:block;width:calc(100% - 32px);margin:4px 16px 8px;height:48px;border-radius:12px;background:var(--accent);color:var(--accent-text);font-weight:600;text-align:center}
.check{width:18px;height:18px;stroke:var(--accent);fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
@keyframes fade{from{opacity:0}}
@keyframes up{from{transform:translateY(40px);opacity:.6}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
.gh{padding:4px 28px 6px;font-weight:700;font-size:17px}
.hint{color:var(--hint);font-size:14px;padding:0 28px 12px}
.sw{position:relative;overflow:hidden}
.sw+.sw{border-top:.5px solid var(--sep)}
.ua{position:absolute;top:0;bottom:0;width:110px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:14px;font-weight:600}
.ua.pin{left:0;background:var(--accent)}.ua.del{right:0;background:var(--danger)}
.note{background:var(--row);position:relative;transition:transform .2s}
.note::before{display:none!important}
.lk{width:14px;height:14px;fill:var(--hint)}
.editor{padding-bottom:70px}
.bar{display:flex;align-items:center;gap:2px}
.ib{width:36px;height:36px;display:grid;place-items:center;color:var(--hint)}
.ib svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ib.on{color:var(--accent)}.ib.on svg{fill:currentColor}
.row{display:flex;gap:10px;align-items:flex-start}
.editor .row textarea{flex:1;min-height:0;font-size:17px;line-height:1.45;overflow:hidden;padding:2px 0}
.row.h textarea{font-size:20px;font-weight:700}
.cb{flex:none;width:22px;height:22px;margin-top:4px;border-radius:50%;border:1.5px solid var(--hint);position:relative}
.cb.on{background:var(--accent);border-color:var(--accent)}
.cb.on::after{content:"";position:absolute;left:6px;top:2px;width:5px;height:10px;border:solid var(--accent-text);border-width:0 2px 2px 0;transform:rotate(45deg)}
.row.done textarea{color:var(--hint);text-decoration:line-through}
.dot{flex:none;width:22px;text-align:center;color:var(--hint);line-height:1.6}
#tail{min-height:40vh}
.tools{position:fixed;left:0;right:0;bottom:0;display:flex;gap:8px;padding:8px 16px;padding-bottom:calc(8px + env(safe-area-inset-bottom,0px));background:var(--row);border-top:.5px solid var(--sep);z-index:3}
.tools button{flex:1;height:38px;border-radius:10px;background:rgba(128,128,128,.14);font-size:15px;font-weight:600}
.tools button.on{background:var(--accent);color:var(--accent-text)}
</style>
</head>
<body>
<div id="app"></div>
<script>
const tg = window.Telegram && window.Telegram.WebApp;
if (tg) { tg.ready(); tg.expand(); }
const COLORS = ['#3390ec','#4fae4e','#e17076','#faa774','#a695e7','#6ec9cb','#ee7aae'];
const MAX = 3500;
const SVG_FOLDER = '<svg viewBox="0 0 24 24"><path d="M3 6.5A2.5 2.5 0 0 1 5.5 4h3.6c.6 0 1.2.3 1.6.8L12 6.4h6.5A2.5 2.5 0 0 1 21 8.9v8.6a2.5 2.5 0 0 1-2.5 2.5h-13A2.5 2.5 0 0 1 3 17.5z"/></svg>';
const SVG_ALL = '<svg viewBox="0 0 24 24"><path d="M6 3h9l4 4v13a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1zm2 9v1.6h8V12zm0 3.6v1.6h8v-1.6zM8 8.4V10h4V8.4z"/></svg>';
const CHEV = '<svg class="chev" viewBox="0 0 8 14"><path d="M1 1l6 6-6 6"/></svg>';

/* ---------- storage: Telegram CloudStorage, localStorage as a fallback for browser testing ---------- */
const cs = tg && tg.initData && tg.CloudStorage ? tg.CloudStorage : null;
const ls = {
  get(k){ try { return localStorage.getItem('nt_'+k) } catch(e){ return null } },
  set(k,v){ try { localStorage.setItem('nt_'+k,v) } catch(e){} },
  del(k){ try { localStorage.removeItem('nt_'+k) } catch(e){} },
  keys(){ try { return Object.keys(localStorage).filter(k=>k.startsWith('nt_')).map(k=>k.slice(3)) } catch(e){ return [] } }
};
const store = {
  keys: () => cs ? new Promise(r => cs.getKeys((e,k) => r(e ? [] : k))) : Promise.resolve(ls.keys()),
  async getMany(keys){
    const out = {};
    for (let i = 0; i < keys.length; i += 40) {
      const part = keys.slice(i, i+40);
      if (cs) Object.assign(out, await new Promise(r => cs.getItems(part, (e,v) => r(e ? {} : v))));
      else part.forEach(k => out[k] = ls.get(k));
    }
    return out;
  },
  set: (k,v) => { ls.set(k,v); return cs ? new Promise(r => cs.setItem(k,v,()=>r())) : Promise.resolve(); },
  del: k => { ls.del(k); return cs ? new Promise(r => cs.removeItem(k,()=>r())) : Promise.resolve(); }
};

/* ---------- state ---------- */
let S = { folders: [], notes: [] }, view = { t:'home' }, q = '', cur = null, timer = null, blocks = [], fi = 0;
const unlocked = new Set();
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,5);
const hap = (t='light') => tg && tg.HapticFeedback && tg.HapticFeedback.impactOccurred(t);
const noteJson = n => JSON.stringify({f:n.folder,t:n.title,x:n.text,d:n.ts,p:n.pin?1:0,r:n.del||0});
const saveNote = n => store.set('n_'+n.id, noteJson(n));
const saveFolders = () => store.set('folders', JSON.stringify(S.folders));
const folderOf = id => S.folders.find(f => f.id === id);
const isLocked = n => { const f = folderOf(n.folder); return !!(f && f.lock); };
const live = () => S.notes.filter(n => !n.del);
const visible = () => live().filter(n => !isLocked(n));
const plain = x => x.replace(/^(- \[[ x]\] |# |• )/gm,'').replace(/\n+/g,' ').trim();
const I_PIN = '<svg viewBox="0 0 24 24"><path d="M9 4h6l-1 6 3 3H7l3-3zM12 13v7"/></svg>';
const I_TRASH = '<svg viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 12a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1l1-12M9 7V4h6v3"/></svg>';
const I_LOCK = '<svg class="lk" viewBox="0 0 24 24"><path d="M7 10V8a5 5 0 0 1 10 0v2h1a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1v-9a1 1 0 0 1 1-1zm2 0h6V8a3 3 0 0 0-6 0z"/></svg>';
const SEARCH = '<div class="search"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg><input id="q" placeholder="Поиск" autocomplete="off"></div>';
const FAB = '<button class="fab" id="fab" aria-label="Новая заметка"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>';

function fmt(ts){
  const d = new Date(ts), n = new Date();
  if (d.toDateString() === n.toDateString()) return d.toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'});
  return d.toLocaleDateString('ru-RU',{day:'numeric',month:'short'}).replace('.','');
}

async function load(){
  const keys = await store.keys();
  const vals = await store.getMany(keys.filter(k => k === 'folders' || k.startsWith('n_')));
  try { S.folders = JSON.parse(vals.folders || ls.get('folders') || '[]') } catch(e){ S.folders = [] }
  ls.keys().filter(k => k.startsWith('n_')).forEach(k => {
    try {
      const l = JSON.parse(ls.get(k)), c = vals[k] ? JSON.parse(vals[k]) : null;
      if (!c || (l.d||0) > (c.d||0)) { vals[k] = ls.get(k); store.set(k, vals[k]); }
    } catch(e){}
  });
  S.notes = Object.keys(vals).filter(k => k.startsWith('n_') && vals[k]).map(k => {
    try { const o = JSON.parse(vals[k]); return { id:k.slice(2), folder:o.f||null, title:o.t||'', text:o.x||'', ts:o.d||0, pin:!!o.p, del:o.r||0 } } catch(e){ return null }
  }).filter(Boolean);
  S.notes = S.notes.filter(n => { if (n.del && Date.now() - n.del > 30*864e5) { store.del('n_'+n.id); return false } return true; });
  S.notes.sort((a,b) => b.ts - a.ts);
  render();
}

/* ---------- biometrics ---------- */
const bio = tg && tg.initData ? tg.BiometricManager : null;
function auth(reason, cb){
  if (!tg || !tg.initData) return cb(true);
  if (!bio) return notice('Блокировка недоступна в этой версии Telegram. Обновите приложение.', cb);
  bio.init(() => {
    if (!bio.isBiometricAvailable) return notice('На устройстве не настроен Face ID или отпечаток пальца.', cb);
    const run = () => bio.authenticate({ reason }, ok => cb(!!ok));
    if (bio.isAccessGranted) run(); else bio.requestAccess({ reason }, g => g ? run() : cb(false));
  });
}
function notice(msg, cb){ if (tg.showAlert) tg.showAlert(msg); else alert(msg); cb(false); }
function openFolder(id){
  const f = folderOf(id);
  if (f && f.lock && !unlocked.has(id)) auth('Открыть папку «' + f.name + '»', ok => { if (ok) { unlocked.add(id); go({ t:'list', f:id }); } });
  else go({ t:'list', f:id });
}
function recheck(){
  if (view.t === 'list' && view.f !== 'all' && view.f !== 'trash') { const f = folderOf(view.f); if (f && f.lock && !unlocked.has(f.id)) return go({ t:'home' }); }
  if (view.t === 'edit' && cur && isLocked(cur) && !unlocked.has(cur.folder)) go({ t:'home' });
}
document.addEventListener('visibilitychange', () => { if (document.hidden) { persist(); unlocked.clear(); } else recheck(); });
addEventListener('pagehide', persist);
addEventListener('blur', persist);

/* ---------- navigation ---------- */
function go(v){ flushEditor(); view = v; q = ''; render(); window.scrollTo(0,0); }
function back(){
  if (view.t === 'edit') { const f = view.from; flushEditor(); go(f || { t:'home' }); }
  else go({ t:'home' });
}
if (tg) tg.BackButton.onClick(back);
function render(){
  if (tg) { if (view.t === 'home') tg.BackButton.hide(); else tg.BackButton.show(); }
  const app = $('#app');
  if (view.t === 'home') home(app); else if (view.t === 'list') list(app); else editor(app);
}

/* ---------- lists ---------- */
function filterNotes(arr){ return q ? arr.filter(n => (n.title + ' ' + n.text).toLowerCase().includes(q)) : arr; }
function groups(arr){
  const now = new Date(), t0 = new Date(now.getFullYear(), now.getMonth(), now.getDate()).getTime(), D = 864e5;
  const g = [['Закреплённые',[]],['Сегодня',[]],['Вчера',[]],['Предыдущие 7 дней',[]],['Раньше',[]]];
  arr.forEach(n => g[n.pin ? 0 : n.ts >= t0 ? 1 : n.ts >= t0-D ? 2 : n.ts >= t0-7*D ? 3 : 4][1].push(n));
  return g.filter(x => x[1].length);
}
function rowsHtml(arr, sf, trash, flat){
  if (!arr.length) return '';
  const row = n => {
    const f = sf && n.folder ? folderOf(n.folder) : null;
    const text = plain(n.text), title = n.title || text.slice(0,60) || 'Без названия';
    return `<div class="sw" data-id="${n.id}">${trash ? '' : `<div class="ua pin">${n.pin ? 'Открепить' : 'Закрепить'}</div><div class="ua del">Удалить</div>`}
      <button class="item note" data-note="${n.id}"><div class="top"><span class="t">${esc(title)}</span><span class="d">${fmt(n.ts)}</span></div>
      <div class="p">${esc((n.title ? text : text.slice(60)).slice(0,160)) || 'Нет текста'}</div>${f ? `<div class="f">${esc(f.name)}</div>` : ''}</button></div>`;
  };
  if (flat) return `<div class="group">${arr.map(row).join('')}</div>`;
  return groups(arr).map(([t,a]) => `<div class="gh">${t}</div><div class="group">${a.map(row).join('')}</div>`).join('');
}
function bindNotes(root, from, trash){
  root.querySelectorAll('.sw').forEach(w => {
    const b = w.querySelector('.note'), id = w.dataset.id, m = () => S.notes.find(x => x.id === id);
    let x0 = 0, y0 = 0, dx = 0, mv = false, vert = false, swiped = false;
    b.ontouchstart = e => { x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; dx = 0; mv = vert = false; b.style.transition = 'none'; };
    b.ontouchmove = e => {
      if (trash) return;
      const ex = e.touches[0].clientX - x0, ey = e.touches[0].clientY - y0;
      if (!mv && !vert) { if (Math.abs(ey) > 8) vert = true; else if (Math.abs(ex) > 8) mv = true; }
      if (mv) { dx = Math.max(-110, Math.min(110, ex)); b.style.transform = `translateX(${dx}px)`; }
    };
    b.ontouchend = () => {
      b.style.transition = ''; b.style.transform = '';
      if (!mv) return;
      swiped = true; setTimeout(() => swiped = false, 120);
      if (dx > 70) { const n = m(); n.pin = !n.pin; saveNote(n); hap(); render(); }
      else if (dx < -70) trashNote(m());
    };
    b.onclick = () => {
      if (swiped) return;
      if (trash) return trashSheet(m());
      go({ t:'edit', id, from });
    };
  });
}
function trashNote(n){ n.del = Date.now(); n.pin = false; saveNote(n); hap('medium'); render(); }
function trashSheet(n){
  sheet(n.title || plain(n.text).slice(0,40) || 'Заметка', [
    { label:'Восстановить', fn:() => { n.del = 0; saveNote(n); render(); } },
    { label:'Удалить навсегда', danger:true, fn:() => confirmDel('Удалить заметку навсегда?', () => { S.notes = S.notes.filter(x => x !== n); store.del('n_'+n.id); render(); }) }
  ]);
}

function home(app){
  const c = {}; live().forEach(n => { const k = n.folder || '_'; c[k] = (c[k]||0) + 1; });
  const trash = S.notes.filter(n => n.del).length;
  const rows = S.folders.map(f => `<button class="item" data-open="${f.id}"><span class="ico" style="background:${f.color}">${SVG_FOLDER}</span><span class="name">${esc(f.name)}</span>${f.lock ? I_LOCK : ''}<span class="cnt">${c[f.id]||0}</span>${CHEV}</button>`).join('');
  app.innerHTML = `
    <div class="head"><h1>Заметки</h1><button class="link" id="addf">Новая папка</button></div>
    ${SEARCH.replace('placeholder="Поиск"','placeholder="Поиск по всем заметкам"')}
    <div id="results"></div>
    <div id="folders">
      <div class="group">
        <button class="item" data-open="all"><span class="ico" style="background:#8e8e93">${SVG_ALL}</span><span class="name">Все заметки</span><span class="cnt">${visible().length}</span>${CHEV}</button>${rows}
      </div>
      ${S.folders.length ? '' : '<div class="empty" style="padding:0 32px 16px"><b>Папок пока нет</b>Создайте папку, чтобы разложить заметки по темам.</div>'}
      <div class="group"><button class="item" data-open="trash"><span class="ico" style="background:#8e8e93"><svg viewBox="0 0 24 24" style="fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round">${I_TRASH.replace(/<\/?svg[^>]*>/g,'')}</svg></span><span class="name">Недавно удалённые</span><span class="cnt">${trash}</span>${CHEV}</button></div>
    </div>${FAB}`;
  app.querySelectorAll('[data-open]').forEach(b => b.onclick = () => openFolder(b.dataset.open));
  $('#addf').onclick = () => folderSheet();
  $('#fab').onclick = () => newNote(null, { t:'home' });
  $('#q').oninput = e => {
    q = e.target.value.trim().toLowerCase();
    $('#folders').style.display = q ? 'none' : '';
    $('#results').innerHTML = q ? rowsHtml(filterNotes(visible()), true, false, true) || '<div class="empty"><b>Ничего не найдено</b>Попробуйте другой запрос.</div>' : '';
    bindNotes($('#results'), { t:'home' });
  };
}

function list(app){
  const id = view.f, all = id === 'all', tr = id === 'trash', f = all || tr ? null : folderOf(id);
  if (!all && !tr && !f) return go({ t:'home' });
  const mine = all ? visible() : tr ? S.notes.filter(n => n.del) : live().filter(n => n.folder === f.id);
  app.innerHTML = `
    <div class="head"><h1>${all ? 'Все заметки' : tr ? 'Недавно удалённые' : esc(f.name)}</h1>${f ? '<button class="link" id="edf">Изменить</button>' : ''}</div>
    ${tr ? '<div class="hint">Заметки хранятся 30 дней, потом удаляются навсегда. Нажмите на заметку, чтобы восстановить её.</div>' : ''}
    ${mine.length > 4 ? SEARCH : ''}<div id="notes"></div>${tr ? '' : FAB}`;
  const fill = () => {
    $('#notes').innerHTML = rowsHtml(filterNotes(mine), all, tr, !!q) || (q
      ? '<div class="empty"><b>Ничего не найдено</b>Попробуйте другой запрос.</div>'
      : `<div class="empty"><b>${tr ? 'Корзина пуста' : 'Здесь пока пусто'}</b>${tr ? '' : 'Нажмите на кнопку внизу, чтобы создать заметку.'}</div>`);
    bindNotes($('#notes'), view, tr);
  };
  fill();
  if ($('#fab')) $('#fab').onclick = () => newNote(all ? null : f.id, view);
  if ($('#q')) $('#q').oninput = e => { q = e.target.value.trim().toLowerCase(); fill(); };
  if (f) $('#edf').onclick = () => sheet(f.name, [
    { label:'Переименовать', fn:() => folderSheet(f) },
    { label: f.lock ? 'Снять блокировку' : 'Заблокировать папку', fn:() => auth(f.lock ? 'Снять блокировку' : 'Включить блокировку', ok => {
        if (!ok) return; f.lock = !f.lock; unlocked.add(f.id); saveFolders(); render(); }) },
    { label:'Удалить папку', danger:true, fn:() => (f.lock ? auth : (r, cb) => cb(true))('Удалить папку', ok => ok && confirmDel('Удалить папку «' + f.name + '»? Заметки останутся в разделе «Все заметки».', () => {
        S.notes.forEach(n => { if (n.folder === f.id) { n.folder = null; saveNote(n); } });
        S.folders = S.folders.filter(x => x.id !== f.id); saveFolders(); go({ t:'home' });
      })) }
  ]);
}

/* ---------- editor: rows (text / heading / bullet / checklist) ---------- */
const parse = x => x.split('\n').map(l =>
  /^- \[[ x]\] /.test(l) ? { k:'c', d:l[3] === 'x', t:l.slice(6) } :
  l.startsWith('# ') ? { k:'h', t:l.slice(2) } :
  l.startsWith('• ') ? { k:'b', t:l.slice(2) } : { k:'p', t:l });
const ser = bl => bl.map(b => b.k === 'c' ? '- [' + (b.d ? 'x' : ' ') + '] ' + b.t : b.k === 'h' ? '# ' + b.t : b.k === 'b' ? '• ' + b.t : b.t).join('\n');

function newNote(folder, from){
  const n = { id: uid(), folder, title:'', text:'', ts: Date.now(), pin:false, del:0 };
  S.notes.unshift(n); hap();
  view = { t:'edit', id:n.id, from }; render();
  setTimeout(() => $('#ti') && $('#ti').focus(), 50);
}
function editor(app){
  cur = S.notes.find(n => n.id === view.id);
  if (!cur) return go({ t:'home' });
  blocks = parse(cur.text); fi = 0;
  const f = folderOf(cur.folder);
  app.innerHTML = `
    <div class="editor">
      <div class="bar"><button class="chip" id="mv"><svg viewBox="0 0 24 24">${SVG_FOLDER.replace(/<\/?svg[^>]*>/g,'')}</svg><span>${f ? esc(f.name) : 'Без папки'}</span></button><span style="flex:1"></span>
        <button class="ib ${cur.pin ? 'on' : ''}" id="pn" aria-label="Закрепить">${I_PIN}</button><button class="ib" id="dl" aria-label="Удалить">${I_TRASH}</button></div>
      <input id="ti" placeholder="Название" maxlength="200" value="${esc(cur.title)}">
      <div id="bl"></div><div id="tail"></div><div class="count" id="cn"></div>
    </div>
    <div class="tools" id="tools"><button data-k="h">Заголовок</button><button data-k="c">Чек-лист</button><button data-k="b">Список</button></div>`;
  const ti = $('#ti');
  ti.oninput = sync;
  ti.onkeydown = e => { if (e.key === 'Enter') { e.preventDefault(); rb(0, 0); } };
  $('#tail').onclick = () => {
    const l = blocks[blocks.length-1];
    if (l.t || l.k !== 'p') { blocks.push({ k:'p', t:'' }); sync(); }
    rb(blocks.length-1);
  };
  $('#tools').querySelectorAll('button').forEach(b => {
    b.onpointerdown = e => e.preventDefault();
    b.onclick = () => {
      const i = Math.min(fi, blocks.length-1), ta = $('#bl').querySelectorAll('textarea')[i], p = ta ? ta.selectionStart : 0;
      blocks[i].k = blocks[i].k === b.dataset.k ? 'p' : b.dataset.k; hap(); sync(); rb(i, p);
    };
  });
  $('#mv').onclick = () => sheet('Переместить в папку', [
    { label:'Без папки', check: !cur.folder, fn:() => moveTo(null) },
    ...S.folders.map(x => ({ label:x.name, check: cur.folder === x.id, fn:() => moveTo(x.id) }))
  ]);
  $('#pn').onclick = () => { cur.pin = !cur.pin; saveNote(cur); hap(); $('#pn').classList.toggle('on', cur.pin); };
  $('#dl').onclick = () => { cur.del = Date.now(); cur.pin = false; saveNote(cur); cur = null; hap('medium'); back(); };
  rb();
}
function rb(focus, pos){
  $('#bl').innerHTML = blocks.map((b,i) => `<div class="row ${b.k}${b.k === 'c' && b.d ? ' done' : ''}" data-i="${i}">${b.k === 'c' ? `<button class="cb ${b.d ? 'on' : ''}" aria-label="Отметить"></button>` : b.k === 'b' ? '<span class="dot">•</span>' : ''}<textarea rows="1" placeholder="${blocks.length === 1 ? 'Текст заметки' : ''}">${esc(b.t)}</textarea></div>`).join('');
  $('#bl').querySelectorAll('.row').forEach(r => {
    const i = +r.dataset.i, ta = r.querySelector('textarea'), b = blocks[i];
    const fit = () => { ta.style.height = 'auto'; ta.style.height = ta.scrollHeight + 'px'; };
    fit();
    ta.onfocus = () => { fi = i; marks(); };
    ta.oninput = () => {
      if (ta.value.includes('\n')) {
        const ls_ = ta.value.split('\n'); b.t = ls_[0];
        blocks.splice(i+1, 0, ...ls_.slice(1).map(t => ({ k: b.k === 'h' ? 'p' : b.k, t, d:false })));
        sync(); return rb(i + ls_.length - 1, 1e9);
      }
      b.t = ta.value; fit(); if (sync()) rb(i);
    };
    ta.onkeydown = e => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        if (b.k !== 'p' && b.k !== 'h' && !b.t) { b.k = 'p'; sync(); return rb(i, 0); }
        const p = ta.selectionStart, rest = b.t.slice(p); b.t = b.t.slice(0, p);
        blocks.splice(i+1, 0, { k: b.k === 'h' ? 'p' : b.k, t:rest, d:false }); sync(); rb(i+1, 0);
      } else if (e.key === 'Backspace' && ta.selectionStart === 0 && ta.selectionEnd === 0) {
        if (b.k !== 'p') { e.preventDefault(); b.k = 'p'; sync(); rb(i, 0); }
        else if (i > 0) { e.preventDefault(); const pv = blocks[i-1], l = pv.t.length; pv.t += b.t; blocks.splice(i, 1); sync(); rb(i-1, l); }
      }
    };
    const cb = r.querySelector('.cb');
    if (cb) cb.onclick = () => { b.d = !b.d; hap(); sync(); rb(); };
  });
  if (focus != null) {
    const t = $('#bl').querySelectorAll('textarea')[focus];
    if (t) { t.focus(); const p = Math.min(pos == null ? t.value.length : pos, t.value.length); t.setSelectionRange(p, p); }
  }
  marks();
}
function marks(){
  const b = blocks[Math.min(fi, blocks.length-1)];
  document.querySelectorAll('#tools button').forEach(x => x.classList.toggle('on', !!b && b.k === x.dataset.k));
}
function sync(){
  let x = ser(blocks), cut = false;
  if (x.length > MAX) {
    const b = blocks[Math.min(fi, blocks.length-1)];
    b.t = b.t.slice(0, Math.max(0, b.t.length - (x.length - MAX))); x = ser(blocks); cut = true;
  }
  cur.text = x; cur.title = $('#ti').value; cur.ts = Date.now();
  $('#cn').textContent = x.length > MAX - 500 ? x.length + ' / ' + MAX : '';
  ls.set('n_'+cur.id, noteJson(cur));
  clearTimeout(timer); timer = setTimeout(persist, 300);
  return cut;
}
function moveTo(fid){ cur.folder = fid; saveNote(cur); hap(); const keep = cur; render(); }
function persist(){ clearTimeout(timer); if (cur && (cur.title.trim() || plain(cur.text))) saveNote(cur); }
function flushEditor(){
  clearTimeout(timer);
  if (!cur) return;
  if (!cur.title.trim() && !plain(cur.text)) { S.notes = S.notes.filter(n => n !== cur); store.del('n_'+cur.id); }
  else { saveNote(cur); S.notes.sort((a,b) => b.ts - a.ts); }
  cur = null;
}

/* ---------- sheets ---------- */
function openShade(html){
  const s = document.createElement('div'); s.className = 'shade'; s.innerHTML = '<div class="sheet">' + html + '</div>';
  s.onclick = e => { if (e.target === s) s.remove(); };
  document.body.appendChild(s); return s;
}
function sheet(title, items){
  const s = openShade(`<h3>${esc(title)}</h3>` + items.map((it,i) =>
    `<button class="item ${it.danger?'danger':''}" data-i="${i}"><span class="name">${esc(it.label)}</span>${it.check ? '<svg class="check" viewBox="0 0 24 24"><path d="M5 12l5 5 9-10"/></svg>' : ''}</button>`).join(''));
  s.querySelectorAll('[data-i]').forEach(b => b.onclick = () => { s.remove(); items[b.dataset.i].fn(); });
}
function confirmDel(msg, ok){
  if (tg && tg.showConfirm) tg.showConfirm(msg, y => { if (y) ok(); });
  else if (confirm(msg)) ok();
}
function folderSheet(f){
  let color = f ? f.color : COLORS[S.folders.length % COLORS.length];
  const s = openShade(`<h3>${f ? 'Переименовать папку' : 'Новая папка'}</h3>
    <input class="field" id="fn" placeholder="Название папки" maxlength="40" value="${f ? esc(f.name) : ''}">
    <div class="colors">${COLORS.map(c => `<button data-c="${c}" style="background:${c}" class="${c===color?'on':''}" aria-label="Цвет"></button>`).join('')}</div>
    <button class="btn" id="ok">${f ? 'Сохранить' : 'Создать'}</button>`);
  s.querySelectorAll('[data-c]').forEach(b => b.onclick = () => {
    color = b.dataset.c; s.querySelectorAll('[data-c]').forEach(x => x.classList.toggle('on', x === b));
  });
  const input = s.querySelector('#fn'); setTimeout(() => input.focus(), 80);
  const done = () => {
    const name = input.value.trim(); if (!name) { input.focus(); return; }
    if (f) { f.name = name; f.color = color; } else S.folders.push({ id: uid(), name, color });
    saveFolders(); s.remove(); hap(); render();
  };
  s.querySelector('#ok').onclick = done;
  input.onkeydown = e => { if (e.key === 'Enter') done(); };
}

load();
</script>
</body>
